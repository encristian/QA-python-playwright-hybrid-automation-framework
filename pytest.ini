[pytest]
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --html=reports/test-report.html
    --self-contained-html
    --output=test-results
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --full-page-screenshot
    --dist=loadscope

markers =
    smoke: Critical tests that verify the application is operational
    regression: Full functional regression tests
    ui: Browser-based user interface tests
    api: Direct REST API tests using Python Requests
    integration: Tests that combine multiple application layers
    network: Tests that inspect browser requests and responses
    mocking: Tests that intercept, mock or block browser requests
    e2e: Complete end-to-end user workflows

generate_report_on_test = True