name: Python Playwright Hybrid Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://automationexercise.com
  DEFAULT_TIMEOUT: "60000"
  API_BASE_URL: https://automationexercise.com/api
  API_TIMEOUT: "30"

jobs:
  chromium-regression:
    name: Chromium Full Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run full regression in Chromium
        run: |
          pytest --browser chromium -n 0 -v

      - name: Upload Chromium test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: chromium-regression-${{ github.run_id }}
          path: |
            reports/test-report.html
            test-results/
          if-no-files-found: warn
          retention-days: 14

  cross-browser-smoke:
    name: Smoke - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ${{ matrix.browser }}
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests in ${{ matrix.browser }}
        run: |
          pytest -m smoke --browser ${{ matrix.browser }} -n 0 -v

      - name: Upload ${{ matrix.browser }} smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            reports/test-report.html
            test-results/
          if-no-files-found: warn
          retention-days: 14